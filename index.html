<script>
function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x}
function appendRich(parent,value){if(typeof value==='string'){parent.textContent=value;return}value.forEach(run=>{let el=document.createTextNode(run.text);if(run.italic){const em=document.createElement('em');em.append(el);el=em}if(run.bold){const strong=document.createElement('strong');strong.append(el);el=strong}parent.append(el)})}
function render(lang){const d=CONTENT[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-nav]').forEach((el,i)=>el.textContent=d.nav[i]);document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));document.getElementById('hero-title').textContent=d.heroKicker;document.getElementById('hero-kicker').textContent=d.heroKicker;const root=document.getElementById('sections');root.replaceChildren();d.sections.forEach((s,si)=>{const section=node('section','section '+(si===1?'section-blue':si===2?'section-strategy':''));section.id=s.id;const wrap=node('div','container');const head=node('div','section-head');head.append(node('h2','',s.title));wrap.append(head);const layout=node('div','work-layout');const list=node('div','work-list');s.items.forEach(item=>{const details=node('details','work-card');const summary=node('summary');const labels=node('span');labels.append(node('span','work-title',item.title),node('span','work-subtitle'+(item.subtitleBold?' is-emphasis':''),item.subtitle));summary.append(labels,node('span','toggle','+'));details.append(summary);const body=node('div','work-body');item.body.forEach(par=>{const el=node('p');appendRich(el,par);body.append(el)});if(item.keywords){const kw=node('div','keywords');kw.append(node('strong','',item.keywordsLabel||d.keywords),document.createTextNode(item.keywords));body.append(kw)}details.append(body);list.append(details)});const fig=node('div','figure');const im=node('img');im.src='assets/web/'+s.image;im.alt='';fig.append(im);layout.append(list,fig);wrap.append(layout);section.append(wrap);root.append(section)});document.getElementById('about-title').textContent=d.about.title;const aboutBody=document.getElementById('about-body');aboutBody.replaceChildren();d.about.body.forEach(par=>{const el=node('p');appendRich(el,par);aboutBody.append(el)});document.getElementById('email-link').textContent=d.email;try{localStorage.setItem('lang',lang)}catch{}}
document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>render(el.dataset.lang)));let lang='en';try{const saved=localStorage.getItem('lang');const browser=(navigator.language||'').toLowerCase();lang=saved||(['de','ja'].find(code=>browser.startsWith(code))||'en')}catch{}render(CONTENT[lang]?lang:'en');
document.addEventListener('copy',event=>event.preventDefault());
document.addEventListener('cut',event=>event.preventDefault());
document.addEventListener('contextmenu',event=>event.preventDefault());
document.addEventListener('dragstart',event=>event.preventDefault());
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&['s','p','c'].includes(event.key.toLowerCase()))event.preventDefault()});
</script>
</body></html>
